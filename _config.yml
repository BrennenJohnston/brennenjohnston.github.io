title: "DIY Assistive Technology created by Brennen"
description: "Open-source 3D-printed assistive technology by Brennen Johnston, lead of WATAP's 3D Printed Assistive Technology Program: ready-to-print devices, works in progress, and curated resources."
url: "https://brennenjohnston.github.io"
baseurl: ""             # stays "" for a user site; "/website" if the repo is named "website"
lang: en
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
# jekyll-feed always builds a feed for the "posts" collection, and this site has
# no posts — left alone, the feed readers find at /feed.xml would be empty. Park
# the posts feed out of the way and give /feed.xml to the projects collection.
feed:
  path: /feed/all.xml
  collections:
    projects:
      path: /feed.xml
  # feed_meta would advertise feed.path (the empty posts feed), so the discovery
  # link is written by hand in _layouts/default.html instead.
  disable_in_head: true
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
exclude:
  - README.md
  - HOW-TO-ADD-A-PROJECT.md
  - Gemfile
  - Gemfile.lock
  - _extract
